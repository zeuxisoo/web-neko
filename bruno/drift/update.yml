info:
  name: update
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/drift/update"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "id": 1,
        "subject": "this is test subject 2",
        "content": "this is test drift content 2",
        "tags": [
          "tags1",
          "tags2"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
