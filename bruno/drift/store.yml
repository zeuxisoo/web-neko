info:
  name: store
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/drift/store"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "subject": "this is test subject",
        "content": "this is test drift content",
        "tags": [
          "tags1",
          "tags2"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
