info:
  name: upload-avatar
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/account/profile/upload/avatar"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: multipart-form
    data:
      - name: file
        type: text
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
