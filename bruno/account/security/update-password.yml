info:
  name: update-password
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/account/security/update/password"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "old_password": "{{password}}",
        "new_password": "{{newPassword}}",
        "new_password_confirmation": "{{newPassword}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
