info:
  name: fetch
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/pulse/link/fetch"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "url": "https://mockhttp.org/"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
