info:
  name: store
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/pulse/comment/store"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "memo_id": 13,
        "content": "hello ha"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
